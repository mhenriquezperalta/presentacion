# GitLab Pages: publica el contenido de la carpeta public/ en cada push a la rama por defecto.
# Antes de publicar, `pnpm build` compila Tailwind CSS a public/assets/css/app.css.
# URL resultante: https://<usuario-o-grupo>.gitlab.io/<repositorio>/
pages:
  stage: deploy
  image: node:22-alpine
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  script:
    - corepack enable   # activa la versión de pnpm de "packageManager" en package.json
    - pnpm install --frozen-lockfile --store-dir .pnpm-store
    - pnpm build
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
